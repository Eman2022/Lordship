spring.application.name=Lordship
spring.profiles.active=dev

# Security: note: each increment doubles the work
security.bcrypt.strength=12
jwt.secret=${JWT_KEY}
jwt.expiration-ms=86400000

# Database - configure these as system environment variables on your machine
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema validation - Flyway manages all schema changes, NOT Hibernate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Lordship - configure the root_password in your environment variables
lordship.root.email=${ROOT_EMAIL}
lordship.root.password=${ROOT_PASSWORD}


spring.aop.proxy-target-class=false